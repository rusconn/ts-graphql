schema {
  query: Query
  mutation: Mutation
}

directive @complexity(
  value: Int!
  multipliers: [String!]
  """
  trueなら直近のmultipliersではスケールせず、それより上のmultipliersでのみスケールする(totalCount, pageInfo等)。
  サブフィールドにも波及する。
  """
  perInstance: Boolean! = false
) on FIELD_DEFINITION

directive @semanticNonNull(levels: [Int] = [0]) on FIELD_DEFINITION

"""
A date-time string at UTC, such as 2007-12-03T10:15:30Z, compliant with the `date-time` format outlined in section 5.6 of the RFC 3339 profile of the ISO 8601 standard for representation of dates and times using the Gregorian calendar.This scalar is serialized to a string in ISO 8601 format and parsed from a string in ISO 8601 format.
"""
scalar DateTimeISO

"""
A field whose value conforms to the standard internet email address format as specified in HTML Spec: https://html.spec.whatwg.org/multipage/input.html#valid-e-mail-address.
"""
scalar EmailAddress
  @specifiedBy(url: "https://html.spec.whatwg.org/multipage/input.html#valid-e-mail-address")

type EmailAlreadyTakenError implements Error {
  message: String!
}

interface Error {
  message: String!
}

enum ErrorCode {
  ACCESS_TOKEN_EXPIRED
  AUTHENTICATION_ERROR
  BAD_USER_INPUT
  FORBIDDEN
  INTERNAL_SERVER_ERROR
  QUERY_TOO_COMPLEX
  RATE_LIMITED
}

type ExpiredVerificationTokenError implements Error {
  message: String!
}

type InvalidInputError implements Error {
  field: String!
  message: String!
}

type InvalidInputErrors {
  errors: [InvalidInputError!]!
}

type InvalidVerificationTokenError implements Error {
  message: String!
}

type Mutation {
  accessTokenRefresh(refreshToken: String!): AccessTokenRefreshResult
    @semanticNonNull
    @complexity(value: 50)
  """
  紐づくリソースは全て削除される

  ログイン済のみ
  """
  accountDelete(
    """
    8文字以上、50文字まで
    """
    password: String!
  ): AccountDeleteResult @semanticNonNull @complexity(value: 1000)
  """
  ログイン済のみ
  """
  accountEmailChange(
    """
    100文字まで、既に存在する場合はエラー
    """
    email: String!
  ): AccountEmailChangeResult @semanticNonNull @complexity(value: 50)
  """
  ログイン済のみ
  """
  accountPasswordChange(
    """
    8文字以上、50文字まで
    """
    oldPassword: String!
    """
    8文字以上、50文字まで
    """
    newPassword: String!
  ): AccountPasswordChangeResult @semanticNonNull @complexity(value: 1000)
  """
  ログイン済のみ
  """
  accountUpdate(
    """
    1文字以上、100文字まで、null は入力エラー
    """
    name: String
  ): AccountUpdateResult @semanticNonNull @complexity(value: 50)
  login(
    """
    100文字まで
    """
    email: String!
    """
    8文字以上、50文字まで
    """
    password: String!
  ): LoginResult @semanticNonNull @complexity(value: 1000)
  logout(
    """
    無効化するリフレッシュトークン
    """
    refreshToken: String!
  ): Void @semanticNonNull @complexity(value: 50)
  """
  未ログインのみ
  """
  signupComplete(
    """
    メールに記載の登録トークン
    """
    token: String!
    """
    1文字以上、100文字まで
    """
    name: String!
    """
    8文字以上、50文字まで
    """
    password: String!
  ): SignupCompleteResult @semanticNonNull @complexity(value: 1000)
  """
  未ログインのみ
  """
  signupRequest(
    """
    100文字まで、既に登録済みの場合も同一のレスポンスを返す
    """
    email: String!
  ): SignupRequestResult @semanticNonNull @complexity(value: 50)
  """
  10000件まで

  ログイン済のみ
  """
  todoCreate(
    """
    100文字まで
    """
    title: String! = ""
    """
    5000文字まで
    """
    description: String! = ""
  ): TodoCreateResult @semanticNonNull @complexity(value: 50)
  """
  ログイン済のみ
  """
  todoDelete(id: ID!): TodoDeleteResult @semanticNonNull @complexity(value: 50)
  """
  ログイン済のみ
  """
  todoStatusChange(id: ID!, status: TodoStatus!): TodoStatusChangeResult
    @semanticNonNull
    @complexity(value: 50)
  """
  ログイン済のみ
  """
  todoUpdate(
    id: ID!
    """
    100文字まで、null は入力エラー
    """
    title: String
    """
    5000文字まで、null は入力エラー
    """
    description: String
    """
    null は入力エラー
    """
    status: TodoStatus
  ): TodoUpdateResult @semanticNonNull @complexity(value: 50)
}

union AccessTokenRefreshResult =
  | AccessTokenRefreshSuccess
  | InvalidRefreshTokenError
  | RefreshTokenExpiredError

type AccessTokenRefreshSuccess {
  accessToken: String!
  refreshToken: String!
}

type InvalidRefreshTokenError implements Error {
  message: String!
}

type RefreshTokenExpiredError implements Error {
  message: String!
}

union AccountDeleteResult = AccountDeleteSuccess | InvalidInputErrors | IncorrectPasswordError

type AccountDeleteSuccess {
  id: ID!
}

type IncorrectPasswordError implements Error {
  message: String!
}

union AccountEmailChangeResult =
  | AccountEmailChangeSuccess
  | InvalidInputErrors
  | EmailAlreadyTakenError

type AccountEmailChangeSuccess {
  user: User!
}

union AccountPasswordChangeResult =
  | AccountPasswordChangeSuccess
  | InvalidInputErrors
  | NewPasswordSameAsOldError
  | IncorrectOldPasswordError

type AccountPasswordChangeSuccess {
  user: User!
}

type NewPasswordSameAsOldError implements Error {
  message: String!
}

type IncorrectOldPasswordError implements Error {
  message: String!
}

union AccountUpdateResult = AccountUpdateSuccess | InvalidInputErrors

type AccountUpdateSuccess {
  user: User!
}

union LoginResult = LoginSuccess | InvalidInputErrors | LoginFailedError

type LoginSuccess {
  accessToken: String!
  refreshToken: String!
}

type LoginFailedError implements Error {
  message: String!
}

union SignupCompleteResult =
  | SignupCompleteSuccess
  | InvalidInputErrors
  | InvalidVerificationTokenError
  | ExpiredVerificationTokenError
  | EmailAlreadyTakenError

type SignupCompleteSuccess {
  accessToken: String!
  refreshToken: String!
}

union SignupRequestResult = SignupRequestSuccess | InvalidInputErrors

type SignupRequestSuccess {
  message: String!
}

union TodoCreateResult = TodoCreateSuccess | InvalidInputErrors | ResourceLimitExceededError

type TodoCreateSuccess {
  todo: Todo!
  todoEdge: TodoEdge!
}

union TodoDeleteResult = TodoDeleteSuccess | ResourceNotFoundError

type TodoDeleteSuccess {
  id: ID!
}

union TodoStatusChangeResult = TodoStatusChangeSuccess | ResourceNotFoundError

type TodoStatusChangeSuccess {
  todo: Todo!
}

union TodoUpdateResult = TodoUpdateSuccess | InvalidInputErrors | ResourceNotFoundError

type TodoUpdateSuccess {
  todo: Todo!
}

interface Node {
  id: ID!
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type Query {
  """
  ログイン済のみ
  """
  node(id: ID!): Node @complexity(value: 3)
  """
  管理者のみ
  """
  user(id: ID!): User @complexity(value: 3)
  """
  管理者のみ
  """
  users(
    """
    max: 30
    """
    first: Int
    after: String
    """
    max: 30
    """
    last: Int
    before: String
    reverse: Boolean! = true
    sortKey: UserSortKeys! = CREATED_AT
  ): UserConnection @semanticNonNull @complexity(value: 3, multipliers: ["first", "last"])
  viewer: User
}

enum UserSortKeys {
  CREATED_AT
  UPDATED_AT
}

type UserConnection {
  pageInfo: PageInfo! @complexity(value: 1, perInstance: true)
  edges: [UserEdge] @semanticNonNull(levels: [0, 1])
  nodes: [User] @semanticNonNull(levels: [0, 1])
  totalCount: Int @semanticNonNull @complexity(value: 5, perInstance: true)
}

type UserEdge {
  cursor: String!
  node: User @semanticNonNull
}

type ResourceLimitExceededError implements Error {
  message: String!
}

type ResourceNotFoundError implements Error {
  message: String!
}

type Todo implements Node {
  """
  所有者、管理者のみ
  """
  id: ID!
  """
  所有者のみ
  """
  title: String @semanticNonNull
  """
  所有者のみ
  """
  description: String @semanticNonNull
  """
  所有者のみ
  """
  status: TodoStatus @semanticNonNull
  """
  所有者、管理者のみ
  """
  createdAt: DateTimeISO @semanticNonNull
  """
  所有者、管理者のみ
  """
  updatedAt: DateTimeISO @semanticNonNull
  """
  所有者、管理者のみ
  """
  user: User @semanticNonNull @complexity(value: 3)
}

enum TodoStatus {
  DONE
  PENDING
}

type User implements Node {
  """
  本人、管理者のみ
  """
  id: ID!
  """
  本人、管理者のみ
  """
  name: String @semanticNonNull
  """
  本人、管理者のみ
  """
  email: EmailAddress @semanticNonNull
  """
  本人、管理者のみ
  """
  createdAt: DateTimeISO @semanticNonNull
  """
  本人、管理者のみ
  """
  updatedAt: DateTimeISO @semanticNonNull
  """
  本人、管理者のみ
  """
  todo(id: ID!): Todo @complexity(value: 3)
  """
  本人、管理者のみ
  """
  todos(
    """
    max: 50
    """
    first: Int
    after: String
    """
    max: 50
    """
    last: Int
    before: String
    reverse: Boolean! = true
    sortKey: TodoSortKeys! = UPDATED_AT
    """
    指定すると絞り込む
    """
    status: TodoStatus
    """
    指定するとtitle及びdescriptionを検索する、30文字まで
    """
    search: String
  ): TodoConnection @semanticNonNull @complexity(value: 3, multipliers: ["first", "last"])
}

enum TodoSortKeys {
  CREATED_AT
  UPDATED_AT
}

type TodoConnection {
  pageInfo: PageInfo! @complexity(value: 1, perInstance: true)
  edges: [TodoEdge] @semanticNonNull(levels: [0, 1])
  nodes: [Todo] @semanticNonNull(levels: [0, 1])
  totalCount: Int @semanticNonNull @complexity(value: 5, perInstance: true)
}

type TodoEdge {
  cursor: String!
  node: Todo @semanticNonNull
}

"""
Represents NULL values
"""
scalar Void
